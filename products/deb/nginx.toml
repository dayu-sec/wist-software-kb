# nginx（Debian/Ubuntu 打包）
#
# canonical_id 是**权威名**（人定的，小写 `<vendor>/<name>`）；
# product_id = "sha256:" + sha256(canonical_id)[:32]，scripts/validate.py 会重算比对。
# 下面的 purl / CPE 只是**别名**，不参与 id 派生。
product_id      = "sha256:32c8d72f8c61e1b39fe3897cfb6c8815"
canonical_id    = "f5/nginx"
canonical_name  = "nginx"
vendor          = "F5"
package_type    = "deb"
homepage        = "https://nginx.org/"
lifecycle_state = "supported"
categories      = ["web-server"]
kind            = "daemon"
default_ports   = [80, 443]


provenance      = "measured"   # 实测：`nginx:1.27-alpine` 里 apk 包 + /usr/sbin/nginx + 镜像名命中
verified_on     = ["docker-image@2026-11-07"]
unverified      = ["recognize.dpkg", "recognize.unit"]
aliases = ["NGINX", "nginx"]

external_ids = [
  { kind = "purl", value = "pkg:deb/debian/nginx" },
  { kind = "cpe", value = "cpe:2.3:a:f5:nginx" },
]

# ── 识别判据（产品固有：换装法也基本成立）───────────────────────────

[[recognize]]
kind     = "apk"
values   = ["nginx"]
strength = "strong"

[[recognize]]
kind     = "path"
values   = ["/usr/sbin/nginx"]
strength = "strong"

[[recognize]]
kind     = "image"
values   = ["nginx"]
strength = "medium"

[[recognize]]
kind     = "unit"
values   = ["nginx.service"]
strength = "strong"

[[recognize]]
kind     = "dpkg"
values   = ["nginx", "nginx-common", "nginx-core"]
strength = "strong"
