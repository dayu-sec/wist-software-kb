# Apache Kafka
#
# 发行形态：**没有任何发行版打包它**。tarball / 容器 / Confluent 包，
# 所以 package_type = generic，版本只能从二进制或镜像 tag 拿（见 definitions/）。
product_id      = "sha256:5645c2aa93a465e71d0d6c5eed906414"
canonical_id    = "apache/kafka"
canonical_name  = "kafka"
vendor          = "Apache Software Foundation"
package_type    = "generic"
homepage        = "https://kafka.apache.org/"
lifecycle_state = "supported"
categories      = ["message-queue"]
kind            = "daemon"
default_ports   = [9092, 9093]


provenance      = "measured"   # 实测：`apache/kafka:3.7.0` 里 /opt/kafka/bin + 镜像名命中
verified_on     = ["docker-image@2026-11-07"]
unverified      = ["recognize.unit", "recognize.container"]
aliases = ["Apache Kafka", "kafka"]

external_ids = [
  { kind = "purl", value = "pkg:generic/apache/kafka" },
  { kind = "purl", value = "pkg:oci/apache/kafka" },
  { kind = "cpe", value = "cpe:2.3:a:apache:kafka" },
]

# ── 识别判据（产品固有：换装法也基本成立）───────────────────────────

[[recognize]]
kind     = "path"
values   = ["/opt/kafka/bin/kafka-server-start.sh", "/opt/bitnami/kafka/bin/kafka-server-start.sh"]
strength = "strong"

[[recognize]]
kind     = "image"
values   = ["apache/kafka", "bitnami/kafka"]
strength = "medium"

[[recognize]]
kind     = "unit"
values   = ["kafka.service", "kafka@*.service"]
strength = "strong"

[[recognize]]
kind     = "container"
values   = ["kafka", "kafka-broker"]
strength = "weak"

# ── 自带运行时（bundles）─────────────────────────────────────────────
# 实测：`apache/kafka:3.7.0` 自带 Temurin 21.0.2 在 /opt/java/openjdk。
# **版本靠探测，不靠声明** —— kafka 升级换了 JDK，这里不用改。
[[bundles]]
product = "openjdk/openjdk"
probe   = { kind = "binary", command = ["/opt/java/openjdk/bin/java", "-version"], stderr = true }
