# wist-cred —— 自有服务
#
# 实测：镜像 `cloud/wist-cred`，基镜像 Ubuntu 24.04，
# 二进制 `/usr/local/bin/wist-cred`，**不在任何包里**（COPY 进去的）。
product_id      = "sha256:cd0c01755442f21c986d144761252c76"
canonical_id    = "wist/cred"
canonical_name  = "wist-cred"
vendor          = "Wist"
package_type    = "oci"
lifecycle_state = "supported"
categories      = ["application"]
kind            = "daemon"
default_ports   = []
provenance      = "measured"
verified_on     = ["docker-image@2026-11-07"]

aliases = ["wist-cred"]

external_ids = [
  { kind = "purl", value = "pkg:oci/wist-cred" },
]

# ── 识别判据（产品固有）───────────────────────────────────────────

[[recognize]]
kind     = "path"
values   = ["/usr/local/bin/wist-cred"]
strength = "strong"

[[recognize]]
kind     = "image"
values   = ["wist-cred"]
match    = "suffix"      # 否则 `wist-atlas` 会命中 `wist-atlas-web`
strength = "medium"
