# wist-center —— 自有服务
#
# 实测：镜像 `cloud/wist-center`，基镜像 Alpine 3.20（无包管理器），
# 二进制 `/usr/local/bin/wist-center`，**不在任何包里**（COPY 进去的）。
product_id      = "sha256:169814e21261d028e401a70b1efcaaa0"
canonical_id    = "wist/center"
canonical_name  = "wist-center"
vendor          = "Wist"
package_type    = "oci"
lifecycle_state = "supported"
categories      = ["application"]
kind            = "daemon"
default_ports   = []
provenance      = "measured"
verified_on     = ["docker-image@2026-11-07"]

aliases = ["wist-center"]

external_ids = [
  { kind = "purl", value = "pkg:oci/wist-center" },
]

# ── 识别判据（产品固有）───────────────────────────────────────────

[[recognize]]
kind     = "path"
values   = ["/usr/local/bin/wist-center"]
strength = "strong"

[[recognize]]
kind     = "image"
values   = ["wist-center"]
match    = "suffix"      # 否则 `wist-atlas` 会命中 `wist-atlas-web`
strength = "medium"
